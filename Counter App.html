<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 500px;
      margin: 0;
      background-color: #f0f0f0;
      
    }

   

    .container {
      border: 3px solid #444;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      background: #fff;
    
    }

    h1 {
      background: #3b6ecb;
      color: white;
      padding: 10px 20px;
      display: flex;
      border-radius: 5px;
    }

    .counter {
      font-size: 40px;
      margin: 20px 0;
      color: #3b6ecb;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border-radius: 8px;
      background: #1e73d8;
      color: white;
      font-size: 16px;
     
    }

    button:hover {
      background: #155bb5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Skills Test: Week 1</h1>
  <div class="counter" id="count">0</div>

  <button onclick="one()">Add 1</button>
  <button onclick="two()">Toggle Theme</button>
</div>

<script>
  let count = 0;

  function one() {
    count++;
    document.getElementById("count").innerText = count;
  }

  function two() {
   
    
  }
</script>

</body>
</html>
